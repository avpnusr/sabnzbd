name: build

on:
  push:
    paths-ignore:
      - 'README.md'
      - '.github/workflows/build.yml'

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - run: | 
          echo "SABVER=$(curl -s https://api.github.com/repos/sabnzbd/sabnzbd/releases/latest | sed -n 's/.*"tag_name": "\(.*\)",/\1/p')" >> $GITHUB_ENV

      -
        name: Checkout
        uses: actions/checkout@v6
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          cache-image: false
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Build and push AMD64 / ARM64 / ARMv7 / ARMv6 images
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.actor }}/sabnzbd:${{ env.SABVER }}
            ghcr.io/${{ github.actor }}/sabnzbd:latest
            avpnusr/sabnzbd:latest
            avpnusr/sabnzbd:${{ env.SABVER }}
